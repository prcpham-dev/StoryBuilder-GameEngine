<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Frankeinstein game</title>
    <!-- <link rel="stylesheet" href="styles.css" /> -->
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Georgia, serif;
        }

        #container {
            margin: 2.5vh 1.5vw;
            font-size: 1.2rem;
            max-width: 45vw;
        }

        #text {
            word-break: break-word;
            overflow-wrap: break-word;
            transition: opacity 0.3s cubic-bezier(.4, 0, .2, 1);
        }

        .option-link,
        .back-link {
            background: none;
            border: none;
            font: inherit;
            cursor: pointer;
            padding: 0;
            text-decoration: none;
            position: relative;
            display: inline-block;
            transition: color 0.3s ease;
        }

        .option-link {
            color: #40d088;
        }

        .back-link {
            margin-top: 0.5em;
            margin-bottom: 0.5em;
            color: #aaa;
        }

        .option-link::after,
        .back-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 2px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .option-link:hover,
        .option-link:focus {
            color: #a1edc7;
        }

        .back-link:hover,
        .back-link:focus {
            color: #ccc;
        }

        .option-link:hover::after,
        .option-link:focus::after,
        .back-link:hover::after,
        .back-link:focus::after {
            transform: scaleX(1);
        }

        @media (max-width: 980px) {
            #container {
                font-size: 1.7rem;
                margin: 2.5vh 2vw;
                max-width: 95vw;
            }
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="back"></div>
        <div id="text"></div>
    </div>

    <!-- <script src="engine.js"></script> -->
    <script>
        const story = {
            "start": {
                "text": `Are you ready? {yes} or {admin}`,
                "choices": [
                    { "label": "yes", "next": "scene1.0" },
                    { "label": "admin", "next": "admin" }
                ]
            },

            "scene1.0": {
                "text": `A loud shriek jolts you awake.<br><br>

                        Instinctively, you try to move, but you can't. Every muscle in your body aches. Your head 
                        thrums painfully. Your eyes blare open, only to be greeted with a room of light devoid.
                        You raise your withered hand into the air, trying to grasp something, anything... <br><br>

                        All you feel is soft cloth beneath your back and weathered stones to your left. 
                        A bedroom, you surmise. <br><br>

                        After a few moments, your eyes adjust to the darkness... at least enough to make out the 
                        dismal place. Another shriek. Is someone coming? You need to escape. You're not sure why, 
                        but you know it to be true. Maybe you should try to {stand...} <br><br>
                        `,
                "choices": [
                    { "label": "stand...", "next": "scene1.1" }
                ]
            },
            "scene1.1": {
                "text": `THUMP.<br><br>

                        In your fugue state, you stumble straight into a table. You fall to the ground, and find yourself 
                        jolted awake by the ice-cold cobblestone floor. Your hands scramble to find solid ground to push yourself up. 
                        Surprisingly, you feel something smooth and thin...<br><br>

                        Paper?<br><br>

                        In the darkness, you can barely make out a scrambled mess of scribbles on the sheets. The sounds are getting louder. Something is approaching. There is little time left. 
                        Decide whether to {take} or {leave} the papers behind.`,
                "choices": [
                    { "label": "take", "next": "scene1.2" },
                    { "label": "leave", "next": "scene1.3" }
                ]
            },
            "scene1.2": {
                "text": `You pat your pants and find a dusty pocket. That'll have to do.
                        You stuff the papers inside your clothes. 
                        The sounds are approaching your room. Choose whether {run} or {hide}.`,
                "choices": [
                    { "label": "run", "next": "ending" },
                    { "label": "hide", "next": "scene1.4" }
                ]
            },
            "scene1.3": {
                "text": `You tried to study the paper, but couldn't make sense of it. 
                        The sounds are approaching your room. Choose whether {run} or {hide}.`,
                "choices": [
                    { "label": "run", "next": "ending" },
                    { "label": "hide", "next": "scene1.4" }
                ]
            },
            "scene1.4": {
                "text": `You resign to stay in this room for now. The world outside could be hostile, after all.
                        You swiftly dive behind a cluttered stack of boxes, pushing aside metallic bits and dirty clothes.
                        The doors slam open, and a paltry light spreads across the room. 
                        Gazing above the boxes, you can make out two figures, one of which holds a bright object. Is that the source of this light?
                        Foreign noises emanate from these creatures -- a form of communication, perhaps?
                        Best to stay hidden for now.<br><br>

                        As the figures draw closer, their faces come into view.
                        One sports a worried expression and grunts as it pushes a chair to the side.
                        The other swings the glowing object this way and that, sighing.
                        The light, shifting around the room, eventually draws your attention to a crude metal plate. It's within reach.
                        At this rate, you'll most assuredly be caught.<br><br>

                        A few thoughts come to mind. Perhaps you can throw the plate {across the room} or {at the figure with the glowing object}.
                        `,
                "choices": [
                    { "label": "at the figure with the glowing object", "next": "scene1.5" },
                    { "label": "across the room", "next": "scene1.7" }
                ]
            },
            "scene1.5": {
                "text": `You toss the plate at one of the figures. It shoots through the room and juts itself within the figure, causing it to
                        collapse. The other screams, grabbing something within the darkness. You sense that this one could be dangerous, so you
                        bolt at it.<br><br>
                        
                        BANG.<br><br>
                        
                        A sharp, searing pain fills your skull, and a strange liquid begins pouring over your eyes. No matter. You fight the pain and grab
                        the figure by its neck. You squeeze the figure tightly as it attempts to sputter something. No matter. It would hurt you again if you
                        spared it.<br><br>
                        
                        After a while, it stops moving. You drop the figure to the ground, wipe the liquid off of your face, and wince at the pain.
                        Though it has begun to reside, it has left a strange, stinging pain. What did the figure do to you? With your limited knowledge, you aren't quite sure.<br><br>
                        
                        You hear familiar noises approaching your location. More of these creatures? Perhaps before, you may have been able to run off, but the pain
                        in your head causes you to stumble slowly. You can only barely {make it out the door}.`,
                "choices": [
                    { "label": "make it out the door", "next": "scene1.6" }
                ]
            },
            "scene1.6": {
                "text": `As you stumble out into the open hallway, you are greeted with a forboding sight: multiple figures, with weapons like the one
                        the other one had, block your way. Behind them, however, is what catches your eye. A gaunt man with sagging eyes and frazzled hair mutters
                        something to the others. The others nod -- from what you can understand, a sign of agreement between the two parties.<br><br>
                        
                        You try to run towards them and attack them, yet it doesn't go as planned. Immediately, the
                        creatures fire something at you in rapid succession. BANG. BANG. BANG. Pain erupts throughout your body. 
                        Your vision blurs, and you crumple to the ground. The pain is too much to bear.<br><br>
                        
                        BANG. <b>BANG</b>.<br><br> 
                        
                        Pain... <i>so much</i> pain. The firing stops, but you cannot move. You bounce in and out of consciousness, attempting at any cost to hold onto your life.
                        After some time -- you cannot gauge how long -- the man from before steps into your view. Through your blurred eyes, he seems... relieved. 
                        He brandishes an object unlike the others, and cautiously approaches your fallen form.<br><br>
                        
                        You try to plead. You try to explain you didn't mean to attack those men. But in your final moments, you can only groan. The man cuts into your
                        body with that object, and everything goes black.

                        {The end...}
                    `,
                "choices": [
                    { "label": "The end...", "next": "restartArea" }
                ]
            },
            "scene1.7": {
                "text": `You toss the plate across the room, and a loud <b>clatter</b> causes both of the figures to yelp in surprise.
                        With not a moment to spare, you burst out from behind the boxes. 
                        At the same time, with eyes bulging, the figures point their light at you and screech in horror.
                        One of them stammers something at you.Though you cannot understand it, you can feel a cold sense of disgust in its tone.
                        The two figures scurry back and begin chattering quickly amongst each other.
                        It appears they are distracted, so you take the opportunity to dash out into the open hallway.<br> <br>

                        Once more, the place you find yourself in is entirely foreign to you. You have no idea who you are, or how you
                        arrived here. At the very least, you have a base sense of what certain objects are, but nothing beyond that.<br><br>

                        Large windows line the hallway, and a lone candle fights back against the overwhelming darkness of the night. Perhaps
                        you can {run through the halls} or {jump through a window}.`,
                "choices": [
                    { "label": "run through the halls", "next": "scene1.6" },
                    { "label": "jump through a window", "next": "scene1.8" }
                ]
            },
            "scene1.8": {
                "text": `You burst through the window, glass shards clattering all around you.<br> 
                        The glass reflects the pale glow of moonlight, which draws your attention to your surroundings.<br> 
                        A weathered dirt road meanders through a packed forest.<br>
                        Beatdown fences struggle to stand, clearly wracked by weather.<br> 
                        You hear someone yell in the distance. Best not to stay in this area any longer. Best to {keep running}.`,
                "choices": [
                    { "label": "keep running", "next": "scene1.9" }
                ]
            },
            "scene1.9": {
                "text": `You wander forth, following the dirt trail. Your stamina, surprisingly, knows no bounds.
                        You trudge for days. The forest soon clears, but the trail continues onward. 
                        You pass through dismal meadows, worn rubble, and shallow riverbeds.
                        Cloudy skies turn to rainy days. Rainy days lead to sun-scorched afternoons. Still, you continue walking.
                        Eventually, after an eternity, you spot a strange collection of buildings on the horizon.
                        The path seems to split from here. You can decide whether to {go to the buildings} or {try another path}.`,
                "choices": [
                    { "label": "go to the buildings", "next": "scene2.0" },
                    { "label": "try another path", "next": "scene1.91" }
                ]
            },
            "scene1.91": {
                "text": `You try the other path first. Fortunately, it does not lead far, bringing you into another forest.
                        You come across some sort of campsite. A pack of tents surrounds a campfire long extinguished.
                        All you hear are the rustling of leaves and chirping birds. It seems to be abandoned, so you might as well look around.<br><br>
                        
                        You rip the tent covers to shreds. While most contain nothing of note, you recover a rusted locket. 
                        There seems to be some person inside... someone quite beautiful, in your eyes. You quickly collect the locket.
                        It seems there isn't much more of note in this area. Perhaps you should {return to the buildings}.
                        `,
                "choices": [
                    { "label": "return to the buildings", "next": "scene2.0" }
                ]
            },
            "scene2.0": {
                "text": `It is night when you finally arrive. 
                        During that time, a part of your mind slowly recollects what this place was called -- a village.
                        There are a few people still wandering around. Judging from your first encounter, they might not take too kindly to you.
                        As such, you hide behind weathered walls and {view them} from afar. Unlike the figures that attacked you, these people seem much more calm.
                        Perhaps you can {approach} one...`,
                "choices": [
                    { "label": "view them", "next": "scene2.1" },
                    { "label": "approach", "next": "scene2.2" }
                ]
            },
            "scene2.1": {
                "text": `You decide to keep watching these people for a while longer.
                        Looking at your own skin, you know you are not what they are.
                        Their fair, smooth skin is nothing like your putrid, green exterior.
                        Your weeks of journeying here catch up to you. A deep exhaustion fills your body and mind, and you wish for nothing else but to sleep.
                        You find a dreary grove of trees nearby and decide to retire there for the night.<br><br>

                        ...<br><br>

                        Your eyes flicker open as sunlight spills over you. You wander back to the village, feeling relatively better than your first night.<br>
                        There are now much more people bustling through the streets. 
                        Perhaps you can {approach} one, {look for somewhere else to go}, or continue to {watch from afar}.
                        `,
                "choices": [
                    { "label": "approach", "next": "scene2.2" },
                    { "label": "watch from afar", "next": "scene2.3" },
                    { "label": "look for somewhere else to go", "next": "scene2.4" },
                ]
            },
            "scene2.2": {
                "text": `You lumber onto the main road, trying to appear as demure as possible.
                        Unexpectedly, despite their formerly calm demeanor, the people do not take so kindly to your appearance.
                        One begins screaming and pointing, and another one tumbles to the ground.
                        You can't make sense of their response. You haven't attacked them like the figures from before!<br><br>

                        For half a minute, you stand there, blankly. 
                        A third person approaches, waving around a weapon like the ones the figure had. 
                        They glower at you, shouting something.
                        Time to go. You turn around and try to escape, but in your confusion... you failed to notice a person behind you.
                        Nothing to do but try to {run}.`,
                "choices": [
                    { "label": "run", "next": "getting_caught_before_scene3" }
                ]
            },
            "scene2.3": {
                "text": `The people continue on with their day. You watch a man sit behind a large display of produce, happily chattering with some townsfolk. The man appears older than the others, sporting a scraggly, white beard and wrinkled skin. Despite his age, he looks substantially better than you do.<br>
                        In what you gather is the center of the town, a statue of an unknown figure sits in the center. A crowd of people surround the figure, moving their bodies in an erratic manner. Some other people stand beside them, wielding strange-looking objects. These objects, you realize, are making noises for moving people. Are they controlling the people with those objects?<br>
                        What catches your eye, however, are the several figures with garb of that like the men who attacked you march throughout the streets. You shiver slightly, remembering your first night. These figures seem much nicer than the others, though. Would they hurt you like before?<br>

                        Perhaps you can {approach} them, or {look for somewhere else to go}.
                        `,
                "choices": [
                    { "label": "approach", "next": "scene2.2" },
                    { "label": "look for somewhere else to go", "next": "scene2.4" },
                ]
            },
            "scene2.4": {
                "text": `You sneak behind buildings, trying your best to stay out of sight. Eventually, you come across a small collection of buildings.<br> 
                        There are a few areas of residence you can go:<br><br>
                        ● A {small green house dotted with neatly trimmed shrubbery and exotic flora.}<br>
                        ● A {two story home with a giant door. The door makes it look as though the house is yawning.}<br>
                        ● A {delicious-smelling home. Your mouth waters from the smell.}<br><br>
                        Alternatively, staying hidden would be the safest option. You can maybe {hide until nightfall again}.
                        `,
                "choices": [
                    { "label": "small green house dotted with neatly trimmed shrubbery and exotic flora.", "next": "scene2.5" },
                    { "label": "two story home with a giant door. The door makes it look as though the house is yawning.", "next": "scene2.6" },
                    { "label": "delicious-smelling home. Your mouth waters from the smell.", "next": "scene2.7" },
                    { "label": "hide until nightfall again", "next": "scene2.8" }
                ]
            },
            "scene2.5": {
                "text": `The house is quite nice and comfy. There's a crackling fireplace, and a plate of food on the table.<br>
                        You could {stay and eat}, or {leave the house}.
                        `,
                "choices": [
                    { "label": "stay and eat", "next": "scene2.51" },
                    { "label": "leave the house", "next": "scene2.4" }
                ]
            },
            "scene2.51": {
                "text": `You sit down and begin chomping away at the food. You haven't eaten in days, so it refuels your mind and body tremendously. <br>
                        You finally begin to rest. You finally notice the soreness in your feet, and your tensed shoulders.<br> 
                        Of course, this peace is short-lived.<br>
                        Someone's voice yells from behind you, and a hand grabs your shoulder. You turn around.
                        A large, beefy man holds a gigantic weapon. You don't want to hurt him... but you don't know if that he feels the same.<br>
                        Not wanting to hurt the man, there's nothing you can do but {try to run}.
                        `,
                "choices": [
                    { "label": "try to run", "next": "getting_caught_before_scene3" }
                ]
            },
            "scene2.6": {
                "text": `The house is a beautiful, lonely place. A gallery of paintings line the walls.<br> 
                        Unfortunately, there doesn't seem to be much of interest besides a {cloak} on the wall.<br> 
                        You {wander} around and don't find anything useful. Might as well {leave}.<br> 
                        `,
                "choices": [
                    { "label": "leave", "next": "scene2.4" },
                    { "label": "wander", "next": "scene2.61" },
                    { "label": "cloak", "next": "scene2_cloak" }
                ]
            },
            "scene2.61": {
                "text": `Again, the house doesn't have much{... of interest}.<br>  
                        You {wander} around some more and don't find anything useful. Might as well {leave}.
                        `,
                "choices": [
                    { "label": "leave", "next": "scene2.4" },
                    { "label": "wander", "next": "scene2.62" },
                    { "label": "... of interest", "next": "scene2.63", "requires": ["scene2.62"] }
                ]
            },
            "scene2.62": {
                "text": `Well, perhaps you need to look further.<br>
                        You toss paintings to the ground.<br>
                        You topple a jar, unintentionally.<br>
                        You eat a plate of fruits in one large gulp.<br>
                        Your giant form is much too large for the doorways, so you must crouch to fit within.<br>
                        Even still, there is nothing of note here. Might as well {leave}.
                        `,
                "choices": [
                    { "label": "leave", "next": "scene2.4" }
                ]
            },
            "scene2.63": {
                "text": `Suddenly, something catches your eye. You {draw} closer to it. Another paper, it appears.<br>
                        Is this particularly interesting? You were unable to decipher the scribbles on the paper before.<br>
                        Strangely, this paper is blank.<br>
                        Might as well {leave}.
                        `,
                "choices": [
                    { "label": "leave", "next": "scene2.4" },
                    { "label": "draw", "next": "scene2.64" }
                ]
            },
            "scene2.64": {
                "text": `Inexplictably, you gain the urge to let out your artistic urges.<br> 
                        You grab a pencil and begin drawing over the paper.<br>
                        As you do, faint memories begin flooding your mind. You were once an artist -- at least, one part of your body was.<br>
                        Judging by the result, it seems that your hand belonged to this artist.<br>
                        You decide to sketch either {a flowerpot by the windowsill}, or {a recently consumed plate of fruit}.<br><br>
                        <b><i><u>{Or... maybe you can draw the lone wolf.}<b><i><u>
                        `,
                "choices": [
                    { "label": "Or... maybe you can draw the lone wolf.", "next": "scene2.67", "requires": ["scene2.65", "scene2.66"] },
                    { "label": "a flowerpot by the windowsill", "next": "scene2.65" },
                    { "label": "a recently consumed plate of fruit", "next": "scene2.66" }
                ]
            },
            "scene2.65": {
                "text": `You pocket the drawing and {leave}.
                        `,
                "choices": [
                    { "label": "leave", "next": "scene2.4" }
                ]
            },
            "scene2.66": {
                "text": `The drawing makes you hungry. You pocket the drawing and {leave}.
                        `,
                "choices": [
                    { "label": "leave", "next": "scene2.4" }
                ]
            },
            "scene2.67": {
                "text": `You finally draw your magnum opus.<br>
                        You finally remember who you are.<br>
                        You are Darian Trep, a master artist who died from sickness many years prior.<br>
                        At least, a part of you is this.<br>
                        You have finally found your life's calling. It is time to draw.<br><br>

                        Many years later, you have once more become a renowned artist.<br>
                        The previous artist who once resided in this residence has not been seen for ages. However, you have taken up residency now.<br>
                        None have seen your face. You deliver your commissions during the night.<br>
                        Many revere your skills. Many chant your name. Many cry over your masterpieces.<br>
                        With your newfound immortality, may Darian reign forevermore...<br>

                        {The end...}`,
                "choices": [
                    { "label": "The end...", "next": "restartArea" }
                ]
            },
            "scene2_cloak": {
                "text": `You swipe the cloak from off the wall and place it over your mottled skin. Best to stay anonymous.<br> 
                        You decide to stay and {wander} around, but don't find anything useful. Might as well {leave}.<br> 
                        `,
                "choices": [
                    { "label": "leave", "next": "scene2.4" },
                    { "label": "wander", "next": "scene2.61" }
                ]
            },
            "scene2.7": {
                "text": `You wander in through the back side of the house, attracted by the delicious scent of fresh food.
                        You spot a large, delectable dessert of some kind. A... pie, if memory serves correctly.
                        You think about {eating it}, or maybe {keeping it for later}. You can also try {leaving}. 
                        `,
                "choices": [
                    { "label": "eating it", "next": "scene2.71" },
                    { "label": "leaving", "next": "scene2.4" },
                    {"label": "keeping it for later", "next": "scene2_pie"}
                ]
            },
            "scene2.71": {
                "text": `You begin devouring the pie, and feel completely refreshed.
                        Unfortunately, in your dazed, hungry state, you fail to notice a group of men approach from behind.
                        One man barks an order, and the other draws a weapon.<br><br>

                        BANG.<br><br>

                        You fall to the ground, dazed. The pie tumbles to the side, crust and juices splattering everywhere.
                        Strange liquid begins pouring from the across your face. You stand up and face the men, but are in no position to fight.
                        In your weakened state, there is nothing you can do but {run}.
                        `,
                "choices": [
                    { "label": "run", "next": "getting_caught_before_scene3" }
                ]
            },
            "scene2_pie": {
                "text": `You take a cover and place it over the pie, then hold it on its side.<br>
                        You think about {eating it still}, but you can also try {leaving}. 
                        `,
                "choices": [
                    { "label": "eating it still", "next": "scene2.71" },
                    { "label": "leaving", "next": "scene2.4" }
                ]
            },
            "scene2.8": {
                "text": `You decide to stay hidden for the rest of the day.<br>
                When night falls, you decide it may be time to {leave the village}.<br><br>
                
                {You feel the need to pull your cloak's hood over your head.}`,
                "choices": [
                    { "label": "leave the village", "next": "scene2.9" },
                    { "label": "You feel the need to pull your cloak's hood over your head.", "next": "scene2.91", "requires": ["scene2_cloak"] }
                ]
            },
            "scene2.9": {
                "text": `As you run back to the path, someone spots you. A voice screams. Now, everyone knows you're here.<br>
                        Several armed men, who had been patrolling the streets, begin running towards you.<br>
                        There's no time to act. You can only {try to run}.
                        `,
                "choices": [
                    { "label": "try to run", "next": "getting_caught_before_scene3" }
                ]
            },
            "scene2.91": {
                "text": `You pull the cloak over your head, obscuring your face and body.
                        Though, your gigantic form may still give you away, so you try to hunch over.
                        You wander as quietly as you can through the main streets, keeping to alleyways and darting behind trees.
                        Eventually, you make it out of the village. You nearly breath a sigh of relief, but then you hear something barking.
                        One of the guarddogs have found you. Immediately, it lunges for you, knocking you over and bruising your back.
                        You knock it off with a swift swipe, but the dog immediately gets back up, growling. You can try {fighting it} or {running away}.
                        {Alternatively, you can try pacifying it with the pie.}
                        `,
                "choices": [
                    { "label": "fighting it", "next": "scene2.9dog" },
                    { "label": "running away", "next": "scene2.9dog" },
                    { "label": "Alternatively, you can try pacifying it with the pie.", "next": "scene2.92", "requires": ["scene2_pie"] }
                ]
            },
            "scene2.9dog": {
                "text": `Before you can run or fight, the dog leaps toward you once again.<br>
                        This time, it latches onto your back with its claws. It sinks its teeth into your neck, causing you to yell through the pain.
                        Suddenly, a horde of guards approach your locale. Drawn in by the noise, you assume.
                        Before you can act, the lot of them fire at you.<br><br>
                        
                        BANG. BANG. BANG. BANG.<br><br>

                        You tumble to the ground, and black out immediately.<br>
                        When you awaken once more, {everything has changed}.
                        `,
                "choices": [
                    { "label": "everything has changed", "next": "circusEnding" }
                ]
            },
            "scene2.92": {
                "text": `You place the pie down gently onto the ground. Immediately, the dog's behavior changes in an instant.
                        It switches its attention to the pie, as if you no longer existed. With the dog pacified, you can continue onwards once more.
                        However, before you can start traveling, you spot a light in the distance. It seems some guards have found you, thanks to the noises.<br>
                        You can try {fighting them} or {running away}.
                        `,
                "choices": [
                    { "label": "fighting them", "next": "scene2.93" },
                    { "label": "running away", "next": "getting_caught_before_scene3" }
                ]
            },
            "scene2.93": {
                "text": `Before the men can draw their weapons, you leap towards them, tackling one to the ground.
                        The other takes a blunt weapon, slamming you repeatedly in the head, yelling all the while.
                        You grab him and toss him into a nearby tree, knocking him out on the spot.
                        The men are mostly beaten by this point, but one remains. You can try {fighting him} or {running away}.
                        `,
                "choices": [
                    { "label": "fighting him", "next": "scene2.94" },
                    { "label": "running away", "next": "scene2_end" }
                ]
            },
            "scene2.94": {
                "text": `Better for none of them to remain. The man wields a blunt weapon like the others, but to no avail.<br>
                        You pick the man up with one hand, holding him by the neck.
                        Eventually, the man stops struggling and you drop him to the ground.
                        However, in the time it took for you to end that man's life, others have appeared to stop you.
                        You attempt to attack these men, too, but this time, you are too slow.<br><br>

                        BANG.<br><br>

                        You fall to the ground, dazed.<br>
                        Strange liquid begins pouring from the across your face. You stand up and face the men, but are in no position to fight.
                        In your weakened state, there is nothing you can do but {run}.
                        `,
                "choices": [
                    { "label": "run", "next": "scene2_end" }
                ]
            },
            "scene2_end": {
                "text": `You quickly retreat into the night. Thankfully, the last man doesn't appear to follow you.
                        It's clear to you now that the people of this world do not take kindly to your appearance.
                        And how can blame them? Someone has seemingly designed you to appear as hideous as possible.
                        You grit your teeth, wondering where to go now.<br><br>

                        The night passes as you follow the path. As day breaks, the path ends.
                        Along the way, you come across wandering people on horses.
                        Each of them scream and run in horror upon seeing your face under the cloak. Better for them to run than fight you, you suppose.<br><br>
                        The day runs past you in a blur, and before you know it, it is nightfall once more.
                        Eventually, in the night, you come across a new residence.<br>
                        You shiver, remembering your previous encounters with people. However, beside the residence lies a shoddy-looking shed. Though you do not intend to stay in this area, your body still aches in pain from the previous night. It would be nice to get some much-needed rest, you think.<br>
                        Exhausted and in pain, you decide to {head to the shed}.
                        `,
                "choices": [
                    { "label": "head to the shed", "next": "scene3.0" }
                ]
            },
            "scene3.0": {
                "text": `After a very long sleep in a shed, you wake up to the sound of birds chirping outside.
                        The sun shines through a small window, warming your face. Your bruises from yesterday are
                        starting to heal. You sit up slowly, observing your surroundings. <br><br>

                        There are sounds of movement outside. You cautiously peek out and see the same
                        creatures that chased you from before. You panicked and thinking of {running away}. <br><br>

                        But as you watch, you realize they are simply livving daily lives. Working with their hands,
                        speaking softly unaware of your presence. You calm down and choose to {observe them from the shed}.
                        <br><br>
                        `,
                "choices": [
                    { "label": "running away", "next": "scene3_run" },
                    { "label": "observe them from the shed", "next": "scene3_drawing" }
                ]
            },
            "scene3_run": {
                "text": `You bolt from the shed and sprint into the forest, branches whipping past your face.
                        Behind you, startled voices rise but no one follows for long. <br><br>

                        You collapse against a fallen log, chest burning, fear twisting inside you.
                        Hours pass before the panic fades. <br><br>

                        But the truth settles uneasily in you running solves nothing.
                        You are still alone. Still without answers. <br><br>

                        As darkness falls, you feel drawn back toward the cottage toward the lives you glimpsed
                        but did not understand. You decide to {return to the shed.}`,
                "choices": [
                    { "label": "return to the shed.", "next": "scene3_observed" }
                ]
            },

            "scene3_drawing": {
                "text": `You stay hidden during the day, afraid to reveal yourself. Through the cracks in the wood,
                        you watch the world beyond the shed. <br><br>

                        You look into the distance. One man kneels beside a wall, dragging dark pigment across the surface.
                        They remind you of things you once saw when you first started this adventure. Then you start to look at
                        it a bit closer, a small white and black creature with four legs. That symbols looks exactly like gentle
                        animal sharing the shed with you now. You seems to understand something. All of the symbols that you saw
                        means something. <br><br>

                        Beside those symbols, there are more as well. You {look around to find other symbols...}`,
                "choices": [
                    { "label": "look around to find other symbols...", "next": "scene3_drawing_choice" }
                ]
            },

            "scene3_drawing_choice": {
                "text": `Among all the symbols you see, two catch your eyes. <br><br>

                        {The first symbol shows chaos}: creatures with long teeth and hairy bodies fighting against
                        humans holding stick similar to yesterday. It feels violent, frightening, and full of pain.
                        <br><br>

                        {The second symbol is the opposite}. A calm field under moonlight.
                        A white and black animal rests in the grass, peaceful and unbothered.
                        No fear. No anger. Just quiet and peace. <br><br>

                        You look at both images carefully. One filled with rage.
                        One filled with peace. One of them speaks to you more. <br><br>`,
                "choices": [
                    { "label": "The first symbol shows chaos", "next": "scene3_chaos" },
                    { "label": "The second symbol is the opposite", "next": "scene3_peace" }
                ]
            },

            "scene3_chaos": {
                "text": `The violent image stirs something inside you. You feel anger rising in your chest.
                        Why were those creatures fighting humans? Were they trying to protect themselves like
                        you did? <br><br>

                        You decide that violence is the only way to survive in this world.
                        You will need to be strong, fierce, and unyielding. <br><br>

                        You carry these feelings back to the shed as you {close the door.}`,
                "choices": [
                    { "label": "close the door.", "next": "scene3_observed" }
                ]
            },

            "scene3_peace": {
                "text": `The peaceful image fills you with a strange calm. You feel a longing in your heart to
                        experience such tranquility. <br><br>

                        You decide that understanding and kindness are the keys to surviving in this world.
                        You will need to be gentle, patient, and open-hearted. <br><br>

                        You carry these feelings back to the shed as you {close the door.}`,
                "choices": [
                    { "label": "close the door.", "next": "scene3_observed" }
                ]
            },

            "scene3_observed": {
                "text": `You stay hidden during the day, watching the family quietly through the cracks in the shed.
                        Their simple kindness pulls at something inside you. You do not understand their words,
                        but you understand the warmth in them. <br><br>

                        Day after day, you return to the same crack in the wood, drawn to their light. <br><br>

                        Over time, you begin to notice patterns, repeated sounds, familiar tones. Slowly, bit by bit,
                        you mimic their words in the darkness, shaping your mouth the way they do. <br><br>

                        You listen especially to the old man. His voice is calm, steady, gentle. You copy the way he forms
                        his sounds, practicing quietly when no one can hear you. <br><br>

                        Sometimes, you hear the old man teaching the boy to speak more clearly, or helping him sound out words
                        from a small book. You listen to every lesson, repeating each sound under your breath. <br><br>

                        You also notice books lying in the field where the boy sometimes forgets them. When the family leaves,
                        you pick them up and trace the symbols slowly with your finger, {trying to understand} what they mean.
                        <br><br>`,
                "choices": [
                    { "label": "trying to understand", "next": "scene3_observed_ending" }
                ]
            },

            "scene3_observed_ending": {
                "text": `You take the books back to the shed and study them one at a time.
                        At first, the symbols blur together, but slowly they begin to understand. <br><br>

                        Paradise Lost teaches you about creation, rejection, and the search for meaning. <br>
                        Plutarch's Lives shows you heroes shaped by struggle and virtue. <br>
                        The Sorrows of Werther fills you with a sadness you never knew had a name. <br><br>

                        These stories change you. They teach you to think, to question, to imagine. You feel both grateful
                        and guilty for taking the books without permission. <br><br>

                        So, at night, you repay them in secret. You gather firewood. You clear snow from their path.
                        You move heavy tools and water buckets to spare them the burden. <br><br>

                        You do not speak to them, but in your own quiet way, you offer thanks. <br>
                        Thanks for the warmth you watch each night. <br>
                        Thanks for the voices that taught you sound and meaning. <br>
                        Thanks for the books that taught you how to think. <br><br>

                        With this new understanding burning inside you, you decide what to do next.
                        It is time to {move forward}.`,
                "choices": [
                    { "label": "move forward", "next": "scene4.0" }
                ]
            },

            "scene4.0": {
                "text": `Night falls. The cottage glows softly. Through the crack in the shed, you see the old man sitting alone. 
                        His face is peaceful. His hands rest on his knees. <br><br>

                        You decide this is the moment. The only moment. He cannot see you; he cannot judge you by your face. <br><br>

                        You step out of the shed and approach the door. Your heart pounds. Your voice trembles. <br><br>

                        “Sir,” you say softly. <br><br>

                        The old man turns toward the sound of your voice. <br>
                        “You sound troubled,” he says kindly. “What is wrong with you, my son?” <br><br>

                        Hearing the word son gives you hope for a connection to the world. You sit beside him. His kindness feels 
                        unreal. You tell him you are alone, unwanted, and afraid. He reaches out, placing a gentle hand on your 
                        arm. <br><br>

                        “No being deserves loneliness,” he tells you. “Stay. When my children return, I will speak for you.” <br><br>

                        For the first time in your life, hope grows inside you. <br><br>

                        You choose to {stay with him.}`,
                "choices": [
                    { "label": "stay with him.", "next": "scene4_meetingFelix" }
                ]
            },

            "scene4_meetingFelix": {
                "text": `Footsteps approach outside. The old man smiles gently. <br>
                        “My children have returned,” he says. “They will welcome you.” <br><br>

                        The door opens. Felix enters first. He freezes when he sees you sitting beside his father. 
                        His face twists in shock, turn into fear and then rage. <br><br>

                        “Get away from him!” Felix shouts. <br><br>

                        You raise your hands to show you mean no harm, but he does not see your hands, only your face. <br><br>

                        He seizes a heavy stick and swings. Pain bursts across your skull. The old man cries out, 
                        “Felix, stop! He is a friend!” <br><br>

                        But fear has already blinded Felix. Blow after blow, he drives you out of the home you hoped would 
                        finally accept you. <br><br>

                        You flee into the cold night, into the forest with a broken heart. {Waiting}, hoping that
                        maybe, by morning, they will change their minds.`,
                "choices": [
                    { "label": "Waiting", "next": "scene4_delaceyMorningAfter" }
                ]
            },

            "scene4_delaceyMorningAfter": {
                "text": `You spend the night alone in the woods. The snow stings your skin. You have never felt so unwanted.
                        <br><br>

                        But the house is empty. Silent. The family has fled. They abandoned their home rather than 
                        live near you. <br><br>

                        The last warmth you ever knew is gone. <br><br>

                        Rage and grief twist together inside you. With shaking hands, you knock over a lantern. 
                        Flames crawl up the wooden wall. The cottage, your first hope, begins to burn. <br><br>

                        You stand outside as the fire grows. Your body refuses to move. A part of you wants 
                        to {stay and watch it burn into ashes.} <br><br>

                        From the distance, you hear shouting. Shouting. Footsteps. Something is coming. 
                        You decide to {flee}, runaway before anything catches you. <br><br>
                    `,
                "choices": [
                    { "label": "stay and watch it burn into ashes.", "next": "getting_caught_after_scene3" },
                    { "label": "flee", "next": "scene4_runaway" }
                ]
            },

            "scene4_runaway": {
                "text": `You run as fast as your legs will carry you, snow scattering beneath your feet. The morning sun glows 
                        faintly behind the clouds, cold light reflecting across the white forest floor. <br><br>

                        Behind you, smoke rises into the pale daylight. Your first fragile hope, the cottage, is now only burning 
                        timber and drifting ash. <br><br>

                        Branches scrape your arms as you push deeper into the snowy woods. At last, your strength fails and you 
                        collapse beneath a tree covered in snow, breath sharp and trembling. <br><br>

                        The world around you is silent. <br>
                        No shouting. <br>
                        No footsteps. <br>
                        Only the stillness of morning and the ache in your chest. <br><br>

                        No one is chasing you. <br>
                        No one is coming. <br>
                        You are completely alone in the winter cold. <br><br>

                        Or all you can think of now is: {Who you are?} <br>
                        {Why are you like this?}`,
                "choices": [
                    // { "label": "Who you are.", "next": "scene4_ending_with_notes", "requires": [] },
                    // { "label": "Why are you like this?", "next": "scene4_ending_with_notes", "requires": [] }
                    { "label": "Who you are?", "next": "scene4_with_notes" },
                    { "label": "Why are you like this?", "next": "scene4_without_notes" }
                ]
            },

            "scene4_with_notes": {
                "text": `As you sit in the snow, breathing hard, a memory returns. <br><br>

                        The papers. The strange notes you found long ago, the ones you could not read. <br><br>

                        Your hand reaches into your pocket. The pages are still there, crumpled and worn, but still readable. 
                        <br><br>

                        Now, with your given knowledge, you know that you are able to understand them. <br><br>

                        This is the answer to eveything. But this thoughts also terrifies you. 
                        In there it could be anything. Good or bad. So now you thinking to yourslef again. Should
                        I {read it} or {not?}`,
                "choices": [
                    { "label": "read it", "next": "originalEnding" },
                    { "label": "not?", "next": "nomadEnding" }
                ]
            },

            "scene4_without_notes": {
                "text": `Sitting in the snow, a memory rises in your mind. <br>
                        "THE NOTES..." you shoted.  <br><br>

                        The strange papers you once found but never understood. Now that you can read, you realize they 
                        might hold every answer you fear to know. The truth of where you came from. The truth of why you 
                        exist. <br><br>

                        The thought frightens you. Should you return to the place where you found them?  
                        Should you go back and face whatever truth waits for you there? <br><br>

                        You are not ready to go now. But the question hangs heavy in your chest. <br><br>

                        {Will you choose to return to the place where it all began?} <br>
                        {Or walk away from the truth forever?}
                        `,
                "choices": [
                    { "label": "Will you choose to return to the place where it all began?", "next": "preOriginalEnding" },
                    { "label": "Or walk away from the truth forever?", "next": "nomadEnding" }
                ]
            },


            "getting_caught_before_scene3": {
                "text": `You try to run, but a sharp blow hits your back. Darkness swallows everything. <br><br>

                        When you wake, you are being dragged through the snow by several men.
                        Chains bite into your wrists and ankles. You cannot stand on your own. <br><br>

                        Angry voices rise around you. You want to speak, to explain, to ask for help but you cannot
                        form their words. Only broken sounds escape your throat. <br><br>

                        You are forced onto your knees. More chains are wrapped around your arms and neck,
                        holding you still. <br><br>

                        Someone yell something outloud. And suddenly something sharp hit your neck, Pain explodes through your body.
                        But slowly you become better. All you could hear is they are chanting something <br><br>

                        FREAK <br><br>

                        The world spins. The shouting grows louder and louder until it becomes a single roar. And something hit
                        your head again. You are getting dizzy and dizzy than everything goes black. <br><br>

                        When you awaken, that same feeling like you once had before. The first moment you open your eyes. 
                        {But this time is different.}`,
                "choices": [
                    { "label": "But this time is different.", "next": "circusEnding" }
                ]
            },

            "getting_caught_after_scene3": {
                "text": `Right when the flame swallows eveything in front of your eye, you turn to leave. But before you can take
                        a siingle step, a sharp blow hits your back. Darkness swallows everything. <br><br>

                        When you wake, you are chained in a room that is fill with people people. You seems to be in a crowded courtroom.
                        People stare as if you are not real. <br><br>

                        A figure in a white gown steps forward. <br>
                        “WHAT ARE YOU?” <br><br>

                        You can speak now. The question stings.
                        You remember the drawings you once saw. {A violent wolf fighting humans.}
                        {A peaceful cow resting under moonlight.} <br><br>

                            You must choose what to say. <br><br>`,
                "choices": [
                    { "label": "A violent wolf fighting humans.", "next": "knightEnding", "requires": ["scene3_chaos"] },
                    { "label": "A peaceful cow resting under moonlight.", "next": "nbsp___", "requires": ["scene3_peace"] },
                ]
            },

            "preOriginalEnding": {
                "text": `You push through the snow, retracing your steps to the place where you first open your eyes.  
                        The cold bites into your skin. Your breath clouds in the cold air. <br><br>

                        Hours pass. The wind howls. And then, through the trees, you finally see it:  
                        An enormous structure rising from the cliffside. It looks partly like a castle and partly like 
                        a mansion, with cracked stone walls, shattered windows, and towers swallowed by ice.  
                        No lights. No voices. Only silence. <br><br>

                        As you step inside, a heavy smell hits you. Damp wood. Mold. Old chemicals that have rotted  
                        into something sour. The air clings to your throat like smoke from a dying fire.  
                        Everything inside was left to decay. <br><br>

                        Rusted machines slump across the floor. Metal has been eaten through by time.  
                        Glass jars lie shattered and stained with colors you cannot name.  
                        Strange tools are scattered everywhere, like pieces of forgotten experiments.  
                        This place created you, yet now it whispers only of ruin. <br><br>

                        You move deeper. The halls twist with shadows. Every surface is slick with damp. The stairs crumble 
                        beneath your feet. The deeper you go, the thicker the smell becomes, until it feels like even the air 
                        has spoiled. <br><br>

                        In a small storage room, dust coats everything. Shelves have collapsed. Tools lie rusted together.  
                        A room that once held purpose now feels like a burial ground for failed ideas. <br><br>

                        Beneath a fallen shelf, something catches your eye. A journal marked with the name Victor Frankenstein.  
                        The pages are yellowed and curled, but still readable. <br><br>

                        You open it and {read everything, pages after pages...}`,
                "choices": [
                    { "label": "read everything, pages after pages...", "next": "originalEnding" }
                ]
            },

            "originalEnding": {
                "text": `Eveything you read terrified you. You are not born you are made. Created in a labaratory from
                        death flesh and bones stitched together. You are a monster. An abomination. A freak. <br><br>
                
                        You think of all you have seen. Every door closed to you. Every face twisted in fear. You understand 
                        now, no human will ever stand beside you. <br><br>

                        You are different. Made, not born. Brought into a world that never asked for you.
                        However, if one man could shape your body from death, if he could breathe life into
                        cold flesh, then he is more than a creator. He is a god. <br><br>

                        And a god who can make life can make another like you someone who will not fear your face,
                        someone who can share the world with you, someone who can end the endless silence.
                        You do not seek revenge. You seek companionship. <br><br>

                        With this new purpose, you now have to find the man Victor. You will find him and you will 
                        demand not love from humanity but the chance to not be alone. <br><br>

                        {The end...}`,
                "choices": [
                    { "label": "The end...", "next": "restartArea" }
                ]
            },

            "nomadEnding": {
                "text": `You think carefully. Should you read the notes? Should you finally learn the truth of your beginning?
                        After a long moment, you decide against it. <br><br>

                        Maybe not knowing where you come from is a kind of freedom.
                        The world has given you nothing but pain. If this is the life you were made for, then
                        what good can truth bring? <br><br>

                        Perhaps forgetting your beginning is a blessing. Perhaps your story does not need a creator
                        to tell it. You walk deeper into the wilds, among wolves, bears, and wandering creatures,
                        you see them being hunted, rejected, feared, torn apart by human. They are not monsters.
                        They are simply different. Just like you. <br><br>

                        Maybe your place has never been among humans at all. Maybe your difference means you are
                        meant to roam beyond them into forests, mountains, and distant lands untouched by mankind. <br><br>

                        You remember the books you once found like Paradise Lost, The Sorrows of Young Werther,
                        and Plutarch's Lives. All of the great stories are of wanderers, exiles, and adventurers.
                        And so you choose adventure. Maybe you are not meant to belong here but somewhere else entirely.
                        A world where your difference is not a curse, but a beginning.<br><br>

                        {The end...}`,
                "choices": [
                    { "label": "The end...", "next": "restartArea" }
                ]
            },

            "circusEnding": {
                "text": `Metal cuffs bite into your wrists and ankles. A collar digs into your neck. Humans drag you into a
                        bright circular tent filled with cheers. You blink, confused—until the first whip strikes your back.
                        The crowd laughs. You are forced to stand, forced to perform, forced to move heavy things for their
                        amusement. <br><br>

                        Every day is the the same. They are fill with screams, laughter, pain. <br><br>

                        Night after night, you lie in chains and think of your beginning. You wish you had never opened your eyes
                        at all. Once, in desperation, you even try to end yourself. But you cannot die. You just simply heal. <br><br>

                        You look at the other animals in cages wolves, bears, creatures who only wanted to protect themself.
                        They tremble when the humans raise the whip. And when they look at you, they tremble even harder.
                        To them, you look like the humans who hurt them. They fear you too. <br><br>

                        You are not human enough for people to love you. <br>
                        You are not animal enough for beasts to trust you. <br>
                        Then what are you? <br><br>

                        In the darkness of the cage, you listen to the crowd outside the cheering, the clapping, the laughter
                        that rises whenever you fall. <br><br>

                        And maybe you understand at last. <br><br>

                        You are a tool. You were made to suffer for others to entertained. <br>
                        Nothing more. <br>
                        Nothing less. <br><br>

                        {The end...}`,
                "choices": [
                    { "label": "The end...", "next": "restartArea" }
                ]
            },

            "knightEnding": {
                "text": `You lift your head. The courtroom waits, tense and trembling. <br><br>

                        “Violence,” you say slowly. “It is in me. It is what I understand.” <br><br>

                        Gasps echo through the hall, but you continue. You speak of the stories you read, battles, heroes, warriors who
                        lived and died by the blade. In those pages, you found something that finally made sense. <br><br>

                        “War does not care for faces or shape,” you tell them. <br>
                        “Only strength. Only will.” <br><br>

                        You look at a man who wears a cloak and a crown in the corner of the room. You bow your head. <br>
                        “Use me,” you say. “I do not want gold. I do not want land. Only battle. Imagine it, an undead warrior that
                        only bows to you."" <br><br>

                        The king steps forward slowly, studying you with a strange mix of caution and curiosity. Then he smiles, a sharp, knowing smile.
                        He signals the guards. Chains fall from your wrists. <br><br>

                        From that day on, you become his warrior. Iron armor hides your face from the world. No one judges you. No one screams.
                        No one asks what you are. <br><br>

                        Behind the helmet, you know this is the closest thing you will ever have. The hunger for violence,
                        the echo of war, the weight of metal on your skin… it is the only place the world
                        ever lets you exist. <br><br>

                        {The end...}`,
                "choices": [
                    { "label": "The end...", "next": "restartArea" }
                ]
            },

        const cleanText = str => str.replace(/\n+/g, ' ').replace(/^\n/, "").replace(/^[ \t]+/gm, "").replace(/\n+/g, "");

        * @param {string} text - The scene text containing placeholders like {talk}.
        * @param {Array} choices - A list of choices, each with "label" and "next".

            */
        function renderText(text, choices) {
            let rendered = cleanText(text);
            choices.forEach(choice => {

                if (choice.requires) {

                        show = choice.requires.every(req => historyStack.includes(req));
                    } else {
                        show = historyStack.includes(choice.requires);
                    }
                }
                const regex = new RegExp("\\{" + choice.label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + "\\}", "gi");
                if (show) {
                    rendered = rendered.replace(
                        regex,
                        `<button class="option-link" onclick="window.goTo('${choice.next}')">${choice.label}</button>`
                    );
                } else {
                    rendered = rendered.replace(regex, "");
                }
            });
            return rendered;
        }

        /**
        * Displays a scene (text + choices) and shows/hides the Back button.
        * @param {string} sceneName - The key of the scene to display.
        */
        function displayScene(sceneName) {
            const scene = story[sceneName];
            if (!scene) return;

            textDiv.style.transition = "opacity 0.3s cubic-bezier(.4,0,.2,1)";
            textDiv.style.opacity = 0;
            setTimeout(() => {
                textDiv.innerHTML = renderText(scene.text, scene.choices);
                textDiv.style.opacity = 1;
            }, 200);

            if (historyStack.length > 1) {
                backDiv.innerHTML =
                    `<button class="back-link" onclick="window.goBack()">← Back</button>`;
            } else {
                backDiv.innerHTML = "";
            }
        }

        /**
        * Goes to a specified scene and pushes it onto the history stack.
        * @param {string} name - The scene to navigate to.
        */
        window.goTo = function (name) {
            if (name === "start") historyStack = [];
            if (historyStack.length === 0 || historyStack[historyStack.length - 1] !== name) historyStack.push(name);
            displayScene(name);
        };

        /**
        * Returns to the previous scene in history.
        */
        window.goBack = function () {
            if (historyStack.length > 1) {
                historyStack.pop();
                const prev = historyStack[historyStack.length - 1];
                displayScene(prev);
            }
        };

        /**
         * Initializes the game by resetting history and going to the start scene.
         */
        window.onload = () => {
            historyStack = [];
            window.goTo('start');
        };
    </script>
</body>

</html>
