<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frankeinstein game</title>
    <!-- <link rel="stylesheet" href="styles.css" /> -->
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Georgia, serif;
        }

        #container {
            margin: 2.5vh 1.5vw;
            font-size: 1.2rem;
            max-width: 60vw;
        }

        #text {
            word-break: break-word;
            overflow-wrap: break-word;
            transition: opacity 0.3s cubic-bezier(.4,0,.2,1);
        }

        .twine-link,
        #back-link {
            background: none;
            border: none;
            font: inherit;
            cursor: pointer;
            color: #40d088;
            padding: 0;
            text-decoration: none;
            position: relative;
            display: inline-block;
            transition: color 0.3s ease;
        }

        #back-link {
            margin-top: 0.5em;
            color: #aaa;
        }

        .twine-link::after,
        #back-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 2px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .twine-link:hover,
        .twine-link:focus {
            color: #a1edc7;
        }

        #back-link:hover,
        #back-link:focus {
            color: #ccc;
        }

        .twine-link:hover::after,
        .twine-link:focus::after,
        #back-link:hover::after,
        #back-link:focus::after {
            transform: scaleX(1);
        }

        @media (max-width: 980px) {
            #container {
                font-size: 2.5rem;
                margin: 2.5vh 2vw;
                max-width: 95vw;
            }
        }

    </style>
</head>

<body>
    <div id="container">
        <div id="text"></div>
        <div id="back"></div>
    </div>

    <!-- <script src="engine.js"></script> -->
    <script>
        const story = {
            "start": {
                "text": `Are you ready? {yes} or {test}`,
                "choices": [
                    { "label": "yes", "next": "scene0" },
                    { "label": "test", "next": "test" }
                ]
            },

            "scene0": {
                "text": `A loud shriek jolts you awake.<br><br>

                        Instinctively, you try to move, but you can't. Every muscle in your body aches. Your head thrums painfully.<br>
                        Your eyes blare open, only to be greeted with a room of light devoid.<br>
                        You raise your withered hand into the air, trying to grasp something, anything...<br>
                        All you feel is soft cloth beneath your back and weathered stones on the side. A bedroom, you surmise.<br><br>

                        After a few moments, your eyes adjust to the darkness... at least enough to make out the dismal place.<br>
                        Another shriek. Is someone coming? You need to escape. You're not sure why, but you know it to be true.<br>
                        Maybe you should try to {stand}...
                        `,
                "choices": [
                    { "label": "stand", "next": "scene0-1" }
                ]
            },
            "scene0-1": {
                "text": `THUMP.<br><br>

                        In your fugue state, you stumble straight into a table.<br>
                        You fall to the ground, and find yourself jolted awake by the ice-cold stone floor.<br>
                        Your hands scramble to find solid ground to push yourself up. Surprisingly, you feel something smooth and thin...<br><br>
                        
                        Paper?<br><br>

                        In the darkness, you can make out a scrambled mass of scribbles on the sheets. You cannot make it out.<br>
                        The screams are getting louder. Something is approaching.<br>
                        There is little time left. Decide whether to {take} or {leave} the papers behind.<br>`,
                "choices": [
                    { "label": "take", "next": "scene1" },
                    { "label": "leave", "next": "scene2" }
                ]
            },
            "scene1": {
                "text": `You pat your pants and find a dusty pocket. That'll have to do.
                        You stuff the papers inside your clothes. 
                        The loud sounds keep is getting louder and louder, you feel like something is approaching you so you decide to {run} or {hide}.`,
                "choices": [
                    { "label": "run", "next": "ending" },
                    { "label": "hide", "next": "scene3" }
                ]
            },
            "scene2": {
                "text": `You study the paper but couldn't make sense of it. The loud sounds keep is getting louder and louder, you feel like something is approaching you so you decide to {run} or {hide}.`,
                "choices": [
                    { "label": "run", "next": "ending" },
                    { "label": "hide", "next": "scene3"}
                ]
            },
            "scene3": {
                "text": `You see this dark like area or corner in the claustrophobic room you are in. You decide to hide there, behind this metalic arms and cloths. The doors open, you see  2 creatures or something holding something very bright. They look at each other and create a sort of sounds. You can't understand what those sounds are but seems like they are communicating with each other. One of the guy looks worried and breathing heavily while the one that is holding the bright things seems calm and annoyed. They start to move around of the room, looking around, you see a rock type things on the floor so you decide between throwing it at {the guy with the light} or {across the room}. 
                        `,
                "choices": [
                    { "label": "the guy with the light", "next": "restart" },
                    { "label": "across the room", "next": "scene4" }
                ]
            },
            "scene4": {
                "text": `You chose to {return} or {sleep}. This is a long sentence added for testing purposes, allowing you to see how a large block of text can be written across multiple lines in your code editor without breaking anything in the story display. Even if this sentence continues far beyond what is practical, the browser will still render it as one continuous paragraph unless you manually insert line breaks.`,
                "choices": [
                    { "label": "return", "next": "scene5" },
                    { "label": "sleep", "next": "originalEnding" }
                ]
            },

            "originalEnding": {
                "text": `You move through the forest, thinking of all you have seen. Every door closed to you. Every face twisted in fear. You understand now, no human will ever stand beside you.

                        You are different. Made, not born. Brought into a world that never asked for you. However, if one man could shape your body from death, if he could breathe life into cold flesh, then he is more than a creator. He is a god.

                        And a god who can make life can make another like you someone who will not fear your face, someone who can share the world with you, someone who can end the endless silence. You do not seek revenge. You seek companionship.

                        With this new purpose, you turn toward the mountains where Victor once worked. You will find him. And you will demand not love from humanity but the chance to not be alone.

                        The end, {restart}`,
                "choices": [
                    { "label": "restart", "next": "start" }
                ]
            },

            "nomadEnding": {
                "text": `You stop walking. You think about the papers. Maybe that is not a mistake. Maybe not knowing where you come from is a kind of freedom. The world has given you nothing but pain. If this is the life you were made for, then what good can truth bring?

                        Perhaps forgetting your beginning is a blessing. Perhaps your story does not need a creator to tell it. You walk deeper into the wilds, among wolves, bears, and wandering creatures, you see them being hunted, rejected, feared, torn apart by human. They are not monsters. They are simply different. Just like you.

                        Maybe your place has never been among humans at all. Maybe your difference means you are meant to roam beyond them into forests, mountains, and distant lands untouched by mankind.

                        You remember the books you once found like Paradise Lost, The Sorrows of Young Werther, and Plutarch’s Lives. All of the great stories are of wanderers, exiles, and adventurers. And so you choose adventure. Maybe you are not meantto belong here but somewhere else entirely. A world where your difference is not a curse, but a beginning.

                        The end {restart}`,
                "choices": [
                    { "label": "restart", "next": "start" }
                ]
            },

            "circusEnding": {
                "text": `You try to run, but a sharp blow hits your back. Darkness swallows everything.

                        When you wake, you are not in the forest. You are chained. Metal cuffs bite into your wrists and ankles. A collar digs into your neck. Humans drag you into a bright circular tent filled with cheers. You blink, confused—until the first whip strikes your back. The crowd laughs. You are forced to stand, forced to perform, forced to move heavy things for their amusement.
                        
                        Every day is the the same. They are fill with screams, laughter, pain.

                        Night after night, you lie in chains and think of your beginning. You wish you had never opened your eyes at all. Once, in desperation, you even try to end yourself. But you cannot die. You just simply heal.
                        
                        You look at the other animals in cages wolves, bears, creatures who only wanted to protect themself. They tremble when the humans raise the whip. And when they look at you, they tremble even harder. To them, you look like the humans who hurt them. They fear you too.

                        You are not human enough for people to love you.
                        You are not animal enough for beasts to trust you.
                        Then what are you?

                        In the darkness of the cage, you listen to the crowd outside the cheering, the clapping, the laughter that rises whenever you fall.
                        
                        And maybe you understand at last.

                        You are a tool. You were made to suffer for others to entertained.
                        Nothing more. 
                        Nothing less.

                        The end {restart}`,
                "choices": [
                    { "label": "restart", "next": "start" }
                ]
            },

            "test": {
                "text": `This is a test scene. You can go to 
                {scene0},
                {originalEnding},
                {nomadEnding},
                {circusEnding}`,
                "choices": [
                    { "label": "scene0", "next": "scene0" },
                    { "label": "originalEnding", "next": "originalEnding" },
                    { "label": "nomadEnding", "next": "nomadEnding" },
                    { "label": "circusEnding", "next": "circusEnding" }
                ]
            },

            "restart": {
                "text": `The end. {restart}, {test}`,
                "choices": [
                    { "label": "restart", "next": "start" },
                    { "label": "test", "next": "start", "requires": ["scene3"] }
                ]
            }
        };

        const textDiv = document.getElementById('text');
        const backDiv = document.getElementById('back');
        let historyStack = [];
        
        /**
        * Replaces {choice} placeholders inside the scene text with clickable buttons.
        * @param {string} text - The scene text containing placeholders like {talk}.
        * @param {Array} choices - A list of choices, each with "label" and "next".
        * @returns {string} - The final HTML string with <button> elements inserted.
        */
        function renderText(text, choices) {
            let rendered = text;
            choices.forEach(choice => {
                let show = true;
                if (choice.requires) {
                    if (Array.isArray(choice.requires)) {
                        show = choice.requires.every(req => historyStack.includes(req));
                    } else {
                        show = historyStack.includes(choice.requires);
                    }
                }
                const regex = new RegExp("\\{" + choice.label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + "\\}", "gi");
                if (show) {
                    rendered = rendered.replace(
                        regex,
                        `<button class="twine-link" onclick="window.goTo('${choice.next}')">${choice.label}</button>`
                    );
                } else {
                    rendered = rendered.replace(regex, "");
                }
            });
            rendered = rendered.replace(/\n/g, "<br>");
            return rendered;
        }
        
        /**
        * Displays a scene (text + choices) and shows/hides the Back button.
        * @param {string} sceneName - The key of the scene to display.
        */
        function displayScene(sceneName) {
            const scene = story[sceneName];
            if (!scene) return;

            textDiv.style.transition = "opacity 0.3s cubic-bezier(.4,0,.2,1)";
            textDiv.style.opacity = 0;
            setTimeout(() => {
                textDiv.innerHTML = renderText(scene.text, scene.choices);
                textDiv.style.opacity = 1;
            }, 200);

            if (historyStack.length > 1) {
                backDiv.innerHTML =
                    `<button id="back-link" onclick="window.goBack()">← Back</button>`;
            } else {
                backDiv.innerHTML = "";
            }
        }

        /**
        * Goes to a specified scene and pushes it onto the history stack.
        * @param {string} name - The scene to navigate to.
        */
        window.goTo = function (name) {
            if (name === "start") historyStack = [];
            if (historyStack.length === 0 || historyStack[historyStack.length - 1] !== name) historyStack.push(name);
            displayScene(name);
        };

        /**
        * Returns to the previous scene in history.
        */
        window.goBack = function () {
            if (historyStack.length > 1) {
                historyStack.pop();
                const prev = historyStack[historyStack.length - 1];
                displayScene(prev);
            }
        };
        
        /**
         * Initializes the game by resetting history and going to the start scene.
         */
        window.onload = () => {
            historyStack = [];
            window.goTo('start');
        };
    </script>
</body>
</html>
